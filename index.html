<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aaron Lim — Portfolio</title>
    <meta
      name="description"
      content="Aaron Lim — AI/ML Engineer, NUS Business Artificial Intelligence Systems. Portfolio of AI engineering, machine learning and software projects."
    />
    <!--
      Sets the `dark` class on <html> before React mounts, so a
      system-dark or previously-toggled visitor doesn't see a flash of
      the wrong theme. Mirrors ThemeContext.jsx's getInitialTheme logic —
      keep the two in sync if that logic changes.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <!--
      Restores the real URL after the 404.html redirect trick (public/404.html).
      Only ever fires on GitHub Pages when a deep link was hit directly; it's an
      inert no-op on Vercel or any host that doesn't use that redirect.
      Pattern: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
